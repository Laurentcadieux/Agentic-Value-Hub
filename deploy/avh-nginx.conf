# Agentic Value Hub — Nginx reverse proxy for the Next.js standalone server.
#
# Install:
#   sudo cp deploy/avh-nginx.conf /etc/nginx/sites-available/avh
#   sudo ln -s /etc/nginx/sites-available/avh /etc/nginx/sites-enabled/avh
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates are managed with certbot (Let's Encrypt). Adjust server_name
# and cert paths to match the deployment domain.

upstream avh_backend {
    # Next.js standalone server bound to 127.0.0.1:3000 (PM2, ecosystem.config.cjs).
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect all HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name agenticvaluehub.com www.agenticvaluehub.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agenticvaluehub.com www.agenticvaluehub.com;

    # TLS (Let's Encrypt / certbot --nginx).
    ssl_certificate     /etc/letsencrypt/live/agenticvaluehub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenticvaluehub.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Reinforce security headers (also emitted by Next.js; belt and braces).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs.
    access_log /var/log/nginx/avh-access.log;
    error_log  /var/log/nginx/avh-error.log;

    # Body size limit (news ingestion JSON, uploads). Raise if needed.
    client_max_body_size 10m;

    # Gzip proxied responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Application.
    location / {
        proxy_pass         http://avh_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cache Next.js static assets aggressively (immutable, content-hashed).
    location /_next/static/ {
        proxy_pass http://avh_backend;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Health/readiness probe — used by PM2 and Uptime Kuma. Keep it light.
    location = /api/health {
        proxy_pass http://avh_backend;
        access_log off;
    }
}
